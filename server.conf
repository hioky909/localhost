server {
    listen 8080;
    listen 8081;
    host 127.0.0.1;
    server_name localhost;
    client_max_body_size 1048576;
    timeout 5;

    error_page 404 www/errors/404.html;
    error_page 500 www/errors/500.html;

    location / {
        root www;
        index index.html;
        allow_methods GET POST;
        autoindex on;
    }

    location /cgi-bin {
        root www/cgi-bin;
        cgi_extension .py;
        allow_methods GET POST;
    }

    location /upload {
        root www/uploads;
        autoindex on;
        allow_methods GET POST DELETE;
        upload_store www/uploads;
    }

    location /redirect_test {
        return /;
    }
}
