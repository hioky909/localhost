server {
    listen 8096;
    host 127.0.0.1;
    server_name ok.local;
    location / {
        root www;
        index index.html;
        allow_methods GET;
    }
}

server {
    listen 8096;
    host 127.0.0.1;
    server_name bad.local;
    location / {
        root www/errors;
        index 404.html;
        allow_methods GET;
    }
}
