server {
    listen 8091;
    host 127.0.0.1;
    server_name a.local;
    location / {
        root www;
        index index.html;
        allow_methods GET;
    }
}

server {
    listen 8092;
    host 127.0.0.1;
    server_name b.local;
    location / {
        root www;
        index index.html;
        allow_methods GET;
    }
}
