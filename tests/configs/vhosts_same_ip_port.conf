server {
    listen 8094;
    host 127.0.0.1;
    server_name alpha.local;
    location / {
        root www;
        index index.html;
        allow_methods GET;
    }
}

server {
    listen 8094;
    host 127.0.0.1;
    server_name beta.local;
    location / {
        root www/errors;
        index 404.html;
        allow_methods GET;
    }
}
