server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root ./www;
    index index.html;
    client_max_body_size 10485760;
    
    error_page 404 /errors/404.html;
    
    location / {
        methods GET POST HEAD;
        autoindex off;
    }
    
    location /upload {
        methods POST DELETE;
        upload_dir ./uploads;
    }
    
    location /cgi-bin {
        methods GET POST;
        root .;
        cgi .py /usr/bin/python3;
    }
    
    location /files {
        methods GET DELETE;
        autoindex on;
    }
}
