<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>500 Erreur interne</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0f12; color: #e8e6e3; font: 15px/1.55 ui-sans-serif, system-ui, sans-serif; }
    .box { text-align: center; padding: 40px; }
    .code { font: 700 120px/1 ui-monospace, Menlo, monospace; letter-spacing: -0.04em; color: #f87171; }
    h1 { font-size: 26px; margin: 12px 0 8px; }
    p { color: #8b9099; max-width: 420px; margin: 0 auto 24px; }
    a { color: #ff8a3d; text-decoration: none; font: 600 14px ui-monospace, Menlo, monospace; }
    small { display: block; margin-top: 40px; color: #4b5059; font: 12px ui-monospace, Menlo, monospace; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">500</div>
    <h1>Erreur interne</h1>
    <p>Le serveur a rencontré un problème en traitant la requête. L'incident est visible dans le journal.</p>
    <a href="/">← retour à l'accueil</a>
    <small>◆ localhost · HTTP/1.1</small>
  </div>
</body>
</html>
